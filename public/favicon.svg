<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>
    .dark-bg,.dark-mark{display:none}
    .light-bg,.light-mark{display:block}
    @media (prefers-color-scheme: dark) {
      .light-bg,.light-mark{display:none}
      .dark-bg,.dark-mark{display:block}
    }
  </style>
  <rect class="light-bg" width="64" height="64" rx="14" fill="#ffffff"/>
  <rect class="dark-bg" width="64" height="64" rx="14" fill="#000000"/>
  <image class="light-mark" href="data:image/png;base64," x="8" y="8" width="48" height="48"/>
  <image class="dark-mark" href="data:image/png;base64," x="8" y="8" width="48" height="48"/>
</svg>
